# Calculate Distance
- project: Calculate Distance
  duration: October 2023
  url: "https://github.com/CarterG2005/calculate-distance"
  description: This Java Program calculates the distance between two cities. It accepts user input for the city names and coordinates. The city names are stored in one-dimensional arrays, and the coordinates are store into two-dimensional arrays. The arrays are passed into the calcDistance function, which calculated the distance between the cities.
